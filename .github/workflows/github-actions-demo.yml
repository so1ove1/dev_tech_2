name: GitHub Actions Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
    - uses: actions/checkout@v4
  
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'

    - name: Check gofmt
      run: |
        files=$(gofmt -s -l .)
        if [ -n "$files" ]; then
          echo "The following files are not formatted with gofmt:"
          echo "$files"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Go Mod Tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Go Mod Verify
      run: go mod verify
    
    - name: Build
      run: go build ./...
  
    - name: Test
      run: go test ./...
